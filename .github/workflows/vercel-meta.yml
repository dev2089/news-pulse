name: Verify Vercel deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        id: deploy
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo, sha = os.environ["REPO"], os.environ["SHA"]
          headers = {"Accept": "application/vnd.github+json"}
          for _ in range(30):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/deployments?sha={sha}&environment=Production&per_page=20",
                  headers=headers
              )
              with urllib.request.urlopen(req) as r:
                  deployments=json.load(r)
              for deployment in deployments:
                  status_url=deployment["statuses_url"]
                  with urllib.request.urlopen(urllib.request.Request(status_url, headers=headers)) as r:
                      statuses=json.load(r)
                  for status in statuses:
                      if status.get("state")=="success" and status.get("target_url"):
                          url=status["target_url"]
                          print("url="+url)
                          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                              f.write("url="+url+"\n")
                          raise SystemExit
              time.sleep(10)
          raise SystemExit("No successful Vercel deployment found")
          PY

      - name: Smoke test the live product
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          curl -sS -f "$URL/" -o /tmp/home.html
          for path in /health /timeline /api/timeline; do
            echo "===== $path ====="
            curl -sS -D /tmp/headers.txt -o /tmp/body.txt -w "HTTP=%{http_code} BYTES=%{size_download}\n" "$URL$path"
            head -20 /tmp/headers.txt || true
            echo "--- body preview ---"
            head -c 600 /tmp/body.txt || true
            echo
            echo
          done
          curl -sS -f "$URL/api/timeline" -o /tmp/timeline-before.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/timeline-before.json"))
          print("initial cluster count:", len(data.get("clusters", [])))
          PY

          TRIGGER=$(curl -sS -f -X POST "$URL/ingest/trigger" -H "content-type: application/json" -d '{}')
          echo "$TRIGGER"
          JOB_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])' <<< "$TRIGGER")

          state="running"
          for _ in $(seq 1 18); do
            STATUS=$(curl -sS -f "$URL/ingest/status/$JOB_ID")
            echo "$STATUS"
            state=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$STATUS")
            if [ "$state" = "completed" ]; then break; fi
            if [ "$state" = "failed" ]; then exit 1; fi
            sleep 10
          done

          if [ "$state" != "completed" ]; then
            echo "Ingestion did not complete within smoke-test window"
            exit 1
          fi

          curl -sS -f "$URL/timeline" -o /tmp/timeline-after.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/timeline-after.json"))
          clusters=data.get("clusters", [])
          print("final cluster count:", len(clusters))
          for cluster in clusters[:30]:
              print(f"- {cluster.get('label')} | {cluster.get('article_count')} articles | {', '.join(cluster.get('sources', []))}")
          if not clusters:
              raise SystemExit("Timeline returned no clusters after ingestion")
          if len(clusters) == 1:
              raise SystemExit("Timeline still has one cluster after ingestion")
          PY

      - name: Publish verified deployment URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          curl -sS -f -X POST \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"success\",\"context\":\"Vercel production URL\",\"description\":\"Live News Pulse deployment verified\",\"target_url\":\"$URL\"}"
          echo "VERIFIED_URL=$URL"
